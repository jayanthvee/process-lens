<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Perf: 1000 fields</title>
<link rel="stylesheet" href="styles.css">
<!--SWITCHES-->
</head>
<body data-page="perf">
<h1>Perf: 1000 labelled fields</h1>
<p><a href="index.html" data-testid="back-to-index">All widgets</a></p>
<p class="hint">
  The snapshot performance case: <code>FIELD_COUNT</code> labelled text inputs,
  each holding a value, generated by script into one container. The budget is
  under 16 ms for the whole set.
</p>
<div class="fields" id="fields" data-testid="fields"></div>
<script src="app.js"></script>
<script>
  (function () {
    "use strict";

    var FIELD_COUNT = 1000;
    var container = document.getElementById("fields");
    var fragment = document.createDocumentFragment();

    for (var index = 1; index <= FIELD_COUNT; index += 1) {
      var label = document.createElement("label");
      label.setAttribute("for", "field-" + index);
      label.textContent = "Field " + index;
      var input = document.createElement("input");
      input.setAttribute("type", "text");
      input.setAttribute("id", "field-" + index);
      input.setAttribute("name", "field-" + index);
      input.setAttribute("data-testid", "field-" + index);
      input.setAttribute("aria-label", "Field " + index);
      input.value = "value " + index;
      fragment.appendChild(label);
      fragment.appendChild(input);
    }

    container.appendChild(fragment);
  })();
</script>
</body>
</html>
