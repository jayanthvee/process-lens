<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notes</title>
<link rel="stylesheet" href="/styles.css">
<!--SWITCHES-->
</head>
<body>
<header class="site-header">
  <h1>Notes</h1>
  <nav class="site-nav">
    <a class="button-link" id="{{ID_BACK_LINK}}" data-testid="back-to-compose" href="index.html">Back to compose</a>
    <a class="button-link" data-testid="nav-second" href="second-page.html">Second page</a>
  </nav>
</header>
<!--ERROR-->
<main>
  <form id="{{ID_SAVE_FORM}}" action="/save" method="post" data-testid="save-form">
    <input type="hidden" name="page" value="notes">
    <section class="notes-section" aria-labelledby="notes-label">
      <span class="field-label" id="notes-label">Notes</span>
      <div id="{{ID_NOTES}}" class="notes" contenteditable="true" role="textbox" aria-multiline="true" aria-labelledby="notes-label" aria-label="Notes" data-testid="notes-box" data-placeholder="Type a note">{{NOTES_TEXT}}</div>
      <input id="{{ID_NOTES_INPUT}}" type="hidden" name="notes" value="{{NOTES_VALUE}}">
    </section>
    <button id="{{ID_SAVE}}" type="submit" data-testid="save">Save</button>
  </form>
</main>
<script src="/app.js"></script>
</body>
</html>
