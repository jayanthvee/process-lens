[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "process-lens"
version = "0.1.0"
description = "Compile a recorded browser task into a versioned recipe and run it over every record."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "psycopg[binary]>=3.2",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "jsonschema>=4.23",
  "pre-commit>=3.8",
  "pytest>=8.3",
  "ruff>=0.8",
]

[tool.setuptools.packages.find]
include = ["db", "services", "services.*"]

[tool.pytest.ini_options]
# Unit tests live next to the component they cover; tests/ holds cross-cutting work.
testpaths = ["tests", "packages"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
